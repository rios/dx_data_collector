name: dx_data_collector - Base Image Build

on:
  push:
    branches:
      - 'feature/*'
      - 'hotfix/*'
      - 'main'
      - 'develop'
    paths:
      - '.github/**'
      - 'docker/**'

  schedule:
    - cron: '0 13 * * 6' # Run every sat at 1pm UTC

jobs:
  build:
    uses: rios-ai/<internal_workflow_templates>/.github/workflows/rios_build.yaml@develop
    with:
      working-directory: .
      run_helm_build: false
      earthly-build-action-target: 'tag-base-image'
    secrets:
      ssh-key: ${{ secrets.CI_SSH_KEY }}
      bot-token: ${{ secrets.RIOS_BOT_TOKEN }}
