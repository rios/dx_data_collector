name: dx_data_collector - Build

on:
  push:
    branches:
      - 'feature/*'
      - 'hotfix/*'
      - 'main'
      - 'develop'
jobs: 
  build:
    uses: ./.github/workflows/rios_build.yaml
    with:
      working-directory: '.'
    secrets:
      ssh-key: ${{ secrets.CI_SSH_KEY }}
      bot-token: ${{ secrets.RIOS_BOT_TOKEN }}
