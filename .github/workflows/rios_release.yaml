# This is a reusable workflow; do not edit this file directy
# source: github.com/rios-ai/<internal_workflow_templates>
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
name: Reusable Build and Release

on:
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
      working-directory:
        required: false
        type: string
        default : '.'
    secrets:
      ssh-key:
        required: true
      bot-token:
        required: true
      earthly-secret-args:
        required: false

jobs:
  release_job:
    runs-on: AWS
    name: Build/Release Earthly container and Helm chart
    steps:
      - name: Set output
        id: vars
        run: |
          export GITHUB_REF_TAG=`echo ${GITHUB_REF#refs/*/}`
          export GITHUB_REF_MAJOR=`echo $GITHUB_REF_TAG | sed -e 's/\.[0-9]*\.[0-9]*$//g'`
          export GITHUB_REF_MINOR=`echo $GITHUB_REF_TAG | sed -e 's/\.[0-9]*$//g'`
          echo "tag=${GITHUB_REF_TAG}" >> $GITHUB_OUTPUT
          echo "tag-major=${GITHUB_REF_MAJOR}" >> $GITHUB_OUTPUT
          echo "tag-minor=${GITHUB_REF_MINOR}" >> $GITHUB_OUTPUT

      - uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.ssh-key }}

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Checkout rios_github_actions repository
        uses: actions/checkout@v3
        with:
          repository: rios-ai/rios_github_actions
          path: .github/actions
          ssh-key: ${{ secrets.ssh-key }}

      - name: Earthly Build Action
        id: earthly
        uses: ./.github/actions/earthly
        with:
          working-directory: ${{ inputs.working-directory }}
          platform: ${{ inputs.platform }}
          build_args: '{"CURRENT_TAG":"${{ steps.vars.outputs.tag }}"}'
          secret_args: ${{ secrets.earthly-secret-args }}

      - name: Helm Build Action
        id: helm
        uses: ./.github/actions/helm
        with:
          working-directory: ${{ inputs.working-directory }}
          tag: ${{ steps.vars.outputs.tag }}

      - uses: rickstaa/action-create-tag@v1.3.9
        with:
          tag: ${{ steps.vars.outputs.tag-major }}
          message: "Major Tag Overwrite"
          force_push_tag: true

      - uses: rickstaa/action-create-tag@v1.3.9
        with:
          tag: ${{ steps.vars.outputs.tag-minor }}
          message: "Major.Minor Tag Overwrite"
          force_push_tag: true

      - name: Write Output to Release
        uses: softprops/action-gh-release@master
        with:
          name: ${{ steps.vars.outputs.tag }}
          token: ${{ secrets.bot-token }}
          draft: 0
          prerelease: 0
          append_body: true
          body: |
            ---
            ## ${{ inputs.working-directory }}
            #### :heavy_check_mark: :whale: Docker image has been built & pushed:
            ```
            ${{ steps.earthly.outputs.latest-tag }}
            ```
            #### :heavy_check_mark: :chart_with_upwards_trend: Helm chart has been built & pushed:
            ```
            ${{ steps.helm.outputs.chart-commit}}
            ```
