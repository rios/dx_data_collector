name: rios

channels:
  - robostack
  - defaults
  - conda-forge

dependencies:
### General ###
    - cmake
    - cxx-compiler
    - gcc
    - pkg-config
    - make
    - ninja
    
### ROS ###
    - ros-noetic-ros-base
    - ros-noetic-tf2-ros
    - catkin_tools
    - rosdep

### C/C++ ###
    - yaml-cpp
    - fmt
    - prometheus-cpp
    - rhash=1.4.1
    - gtest
    - spdlog=1.12.0
    - aws-sdk-cpp
    - ros-noetic-cv-bridge

### Python ###    
    - python=3.8.16
    - vcstool
    - pybind11
    - numpy
    - pip
    - pip:
      - --extra-index-url http://<internal_pypi>/simple --trusted-host <internal_pypi>    
      - empy

prefix: /opt/miniconda