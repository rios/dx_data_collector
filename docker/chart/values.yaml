# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

dockerRegistry: "<internal_registry>"
containerTag: develop
collectorName: dx_data_collector

env:
  PYTHONUNBUFFERED: 1
  ROSCONSOLE_STDOUT_LINE_BUFFERED: 1

configs: {}
nameOverride: ""
fullnameOverride: ""
fsOutputDir: /data-pool/bags # Where to output filesystem data on host machine

# These values specify how to assign this deployment to a k3s Node
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - headnode

# Sysmon health (default) probes configuration
sysmon_probes:
  host: "rios-dx-sysmon-service"
  port: 31415
  paths:
    startup: "/rios/sysmon/healthprobe/startup"
    liveness: "/rios/sysmon/healthprobe/liveness"
    readiness: 
